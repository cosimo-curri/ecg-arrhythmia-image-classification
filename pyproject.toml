[build-system]
requires = ["setuptools==82.0.1"]
build-backend = "setuptools.build_meta"

[project]
name = "ecg-arrhythmia-image-classification"
version = "0.1.0"
description = "Research prototype for CNN-based ECG beat image classification"
readme = "README.md"
requires-python = ">=3.11,<3.14"
dependencies = [
  "numpy==2.3.5",
  "opencv-python-headless==4.13.0.92",
  "matplotlib==3.10.8",
  "wfdb==4.3.1",
  "tensorflow==2.21.0",
  "tensorboard==2.21.0",
  "scikit-learn==1.8.0",
  "imutils==0.5.4",
]

[project.optional-dependencies]
test = ["pytest==9.0.2"]
notebook = ["jupyter==1.1.1"]

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
ecg_classification = ["resources/*.txt"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
